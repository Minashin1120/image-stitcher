name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0). Required for manual run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "tag_name is required for workflow_dispatch"
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' ; then
            echo "Invalid format. Use vX.Y.Z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name != '' && github.sha || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup fixed keystore
        run: |
          mkdir -p ~/.android
          mkdir -p ci
          if [ -f ci/debug.keystore ]; then
            echo "Using ci/debug.keystore"
            cp ci/debug.keystore ~/.android/debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using debug.keystore from root"
            cp debug.keystore ~/.android/debug.keystore
            cp debug.keystore ci/debug.keystore
          elif [ -f ci/debug.keystore.base64 ]; then
            echo "Restoring from ci/debug.keystore.base64"
            base64 -d ci/debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ci/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring from debug.keystore.base64"
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ci/debug.keystore
          else
            echo "Generating fixed debug keystore as fallback"
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ci/debug.keystore
          fi
          cp ~/.android/debug.keystore debug.keystore || true
          ls -lh ~/.android/debug.keystore

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK not found"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Get version
        id: get_version
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "VERSION=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

