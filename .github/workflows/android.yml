name: Android CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'ci/**'
      - 'debug.keystore'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'ci/**'
      - 'debug.keystore'
      - '.github/workflows/android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11.1'

      - name: Ensure valid Gradle Wrapper
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.11.1 || true

      - name: Setup fixed debug keystore
        run: |
          mkdir -p ~/.android
          mkdir -p ci
          if [ -f ci/debug.keystore ]; then
            echo "Using ci/debug.keystore"
            cp ci/debug.keystore ~/.android/debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using debug.keystore from root"
            cp debug.keystore ~/.android/debug.keystore
            cp debug.keystore ci/debug.keystore
          elif [ -f ci/debug.keystore.base64 ]; then
            echo "Restoring from ci/debug.keystore.base64"
            base64 -d ci/debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ci/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring from debug.keystore.base64"
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ci/debug.keystore
          else
            echo "Generating fixed debug keystore as fallback"
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ci/debug.keystore
          fi
          cp ~/.android/debug.keystore debug.keystore || true
          ls -lh ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
